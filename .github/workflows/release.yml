name: Release checks

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo install bindgen-cli --version 0.72.1 --locked
      - run: scripts/check_release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ani-rs-crates-${{ github.ref_name }}
          path: target/package/*.crate

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Publish crates in dependency order
        run: |
          cargo publish -p ani-sys
          cargo publish -p ani-derive
          for attempt in 1 2 3 4 5; do
            cargo publish -p ani && break
            test "$attempt" -lt 5
            sleep 15
          done
          cargo publish -p ani-cli
      - name: Package release artifacts
        run: |
          cargo package -p ani-sys --no-verify
          cargo package -p ani-derive --no-verify
          cargo package -p ani --no-verify
          cargo package -p ani-cli --no-verify
      - name: Create GitHub release
        run: gh release create "${GITHUB_REF_NAME}" target/package/*.crate --generate-notes
