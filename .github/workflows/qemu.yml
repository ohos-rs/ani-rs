name: OpenHarmony QEMU v20260731

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      guest_arch:
        description: Architecture of the running QEMU guest
        required: true
        default: all
        type: choice
        options:
          - all
          - arm64
          - x86_64
          - armv7a
      asan_runner:
        description: Build the device-side ABC runner with AddressSanitizer
        required: true
        default: false
        type: boolean
      lsan:
        description: Enable LSan when the selected OpenHarmony runtime supports it
        required: true
        default: false
        type: boolean
      rust_asan:
        description: Instrument Rust cdylibs with nightly AddressSanitizer
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ohos-qemu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qemu:
    name: API 26 / ${{ matrix.guest_arch }} QEMU
    runs-on: ${{ matrix.guest_arch == 'x86_64' && 'ubuntu-22.04' || 'macos-14' }}
    strategy:
      fail-fast: false
      matrix:
        guest_arch: ${{ fromJSON((inputs.guest_arch == '' || inputs.guest_arch == 'all') && '["arm64","x86_64","armv7a"]' || format('["{0}"]', inputs.guest_arch)) }}
    timeout-minutes: 240
    env:
      HDC_TARGET: 127.0.0.1:5558
      OHOS_QEMU_RELEASE_REPOSITORY: harmony-contrib/ohos-qemu
      OHOS_QEMU_RELEASE_TAG: v20260731
      OHOS_QEMU_GUEST_ARCH: ${{ matrix.guest_arch }}
      OHOS_QEMU_REMOTE_ROOT: /data/local/tmp/ani-rs-qemu-${{ github.run_id }}-${{ matrix.guest_arch }}
      OHOS_QEMU_REQUIRE_PACKAGE_PROCESS: 1
      OHOS_QEMU_USE_ABC_FIXTURES: 1
      OHOS_QEMU_RUNNER_ASAN: ${{ inputs.asan_runner && '1' || '0' }}
      OHOS_QEMU_LSAN: ${{ inputs.lsan && '1' || '0' }}
      OHOS_QEMU_RUST_ASAN: ${{ inputs.rust_asan && '1' || '0' }}
      OHOS_QEMU_HDC_TIMEOUT: 60
      # The pinned v20260731 release is the JIT-fixed baseline. Correctness,
      # lifecycle, memory, and performance gates all exercise Ark JIT.
      OHOS_QEMU_DISABLE_JIT: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Verify ArkTS/ABC compatibility fixtures
        shell: bash
        run: scripts/check_qemu_abc_fixtures.sh
      - name: Setup OpenHarmony SDK
        id: ohos-sdk
        uses: openharmony-rs/setup-ohos-sdk@eb82b94ef522b07269679195c2512f22e922ef3b # v1.0.0
        with:
          version: "6.1"
          components: native;toolchains
          cache: true
          mirror: true
      - name: Export OpenHarmony SDK
        shell: bash
        run: |
          sdk_root="${{ steps.ohos-sdk.outputs.ohos-base-sdk-home }}"
          test -d "$sdk_root/native"
          test -x "$sdk_root/toolchains/hdc"
          echo "DEVECO_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/toolchains" >> "$GITHUB_PATH"
      - name: Setup Java for HAP packing
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup full-system QEMU
        uses: ./.github/actions/setup-system-qemu
        with:
          guest-arch: ${{ matrix.guest_arch }}
          require-kvm: ${{ matrix.guest_arch == 'x86_64' && 'true' || 'false' }}
      - name: Resolve package and Rust target
        shell: bash
        run: |
          case "$OHOS_QEMU_GUEST_ARCH" in
            arm64)
              package=openharmony-qemu-arm64-arm64_virt
              rust_target=aarch64-unknown-linux-ohos
              archive_sha256=de9505e52d6ab9dd0455925a1446239bf6866e3697353b535acc57582181fd16
              ;;
            x86_64)
              package=openharmony-qemu-x86_64-x86_64_virt
              rust_target=x86_64-unknown-linux-ohos
              archive_sha256=c9d4fad3b5ee7dfbf1b24c3acd6a80260ae0f78d946d5837038f53dd14a104a2
              ;;
            armv7a)
              package=openharmony-qemu-armv7a-armv7a_virt
              rust_target=armv7-unknown-linux-ohos
              archive_sha256=05284c045d18840bea52d8a050409b6c865c3a81377a67d9563cee1931523f7b
              ;;
            *) exit 2 ;;
          esac
          archive="$package.tar.gz"
          tool_cache="${RUNNER_TOOL_CACHE:-$RUNNER_TEMP/ani-rs-tool-cache}"
          archive_path="$tool_cache/ani-rs/ohos-qemu/$OHOS_QEMU_RELEASE_TAG/${OHOS_QEMU_GUEST_ARCH}.tar.gz"
          packages_root="$RUNNER_TEMP/ohos-qemu-$OHOS_QEMU_RELEASE_TAG-$OHOS_QEMU_GUEST_ARCH"
          echo "OHOS_QEMU_ARCHIVE=$archive" >> "$GITHUB_ENV"
          echo "OHOS_QEMU_ARCHIVE_PATH=$archive_path" >> "$GITHUB_ENV"
          echo "OHOS_QEMU_ARCHIVE_SHA256=$archive_sha256" >> "$GITHUB_ENV"
          echo "QEMU_PACKAGES_ROOT=$packages_root" >> "$GITHUB_ENV"
          echo "QEMU_PACKAGE_ROOT=$packages_root/$package" >> "$GITHUB_ENV"
          echo "OHOS_RUST_TARGET=$rust_target" >> "$GITHUB_ENV"
          echo "OHOS_QEMU_WORK_ROOT=$RUNNER_TEMP/ani-rs-qemu-${GITHUB_RUN_ID}-${OHOS_QEMU_GUEST_ARCH}" >> "$GITHUB_ENV"
      - name: Verify hosted runner prerequisites
        shell: bash
        run: |
          case "$OHOS_QEMU_GUEST_ARCH" in
            arm64) qemu_binary=qemu-system-aarch64 ;;
            x86_64) qemu_binary=qemu-system-x86_64 ;;
            armv7a) qemu_binary=qemu-system-arm ;;
            *) exit 2 ;;
          esac
          command -v "$qemu_binary"
          command -v curl
          command -v tar
          test -x "$DEVECO_SDK_ROOT/toolchains/hdc"
      - name: Restore pinned QEMU release archive
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/ani-rs/ohos-qemu/v20260731/${{ matrix.guest_arch }}.tar.gz
          key: ohos-qemu-${{ runner.os }}-v20260731-${{ matrix.guest_arch }}
      - name: Download, verify and extract QEMU v20260731
        shell: bash
        run: |
          sha256_file() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" | awk '{print $1}'
            elif command -v shasum >/dev/null 2>&1; then
              LC_ALL=C LANG=C shasum -a 256 "$1" | awk '{print $1}'
            elif command -v openssl >/dev/null 2>&1; then
              openssl dgst -sha256 "$1" | awk '{print $NF}'
            else
              echo "missing SHA-256 implementation" >&2
              return 127
            fi
          }

          mkdir -p "$(dirname "$OHOS_QEMU_ARCHIVE_PATH")" "$QEMU_PACKAGES_ROOT"
          if [[ -f "$OHOS_QEMU_ARCHIVE_PATH" ]] &&
            [[ "$(sha256_file "$OHOS_QEMU_ARCHIVE_PATH")" != "$OHOS_QEMU_ARCHIVE_SHA256" ]]; then
            echo "cached QEMU archive checksum mismatch; downloading a clean copy" >&2
            rm -f "$OHOS_QEMU_ARCHIVE_PATH"
          fi
          if [[ ! -f "$OHOS_QEMU_ARCHIVE_PATH" ]]; then
            url="https://github.com/$OHOS_QEMU_RELEASE_REPOSITORY/releases/download/$OHOS_QEMU_RELEASE_TAG/$OHOS_QEMU_ARCHIVE"
            temporary="$OHOS_QEMU_ARCHIVE_PATH.tmp.$GITHUB_RUN_ID"
            trap 'rm -f "$temporary"' EXIT
            curl -fL --retry 5 --retry-delay 2 \
              -o "$temporary" "$url"
            mv "$temporary" "$OHOS_QEMU_ARCHIVE_PATH"
            trap - EXIT
          fi
          actual_sha256="$(sha256_file "$OHOS_QEMU_ARCHIVE_PATH")"
          if [[ "$actual_sha256" != "$OHOS_QEMU_ARCHIVE_SHA256" ]]; then
            echo "QEMU archive checksum mismatch: expected $OHOS_QEMU_ARCHIVE_SHA256, got $actual_sha256" >&2
            exit 1
          fi
          if LC_ALL=C LANG=C tar -tzf "$OHOS_QEMU_ARCHIVE_PATH" |
            awk -v root="$(basename "$QEMU_PACKAGE_ROOT")/" 'index($0, root) != 1 { exit 1 }'; then
            LC_ALL=C LANG=C tar -xzf "$OHOS_QEMU_ARCHIVE_PATH" -C "$QEMU_PACKAGES_ROOT"
          else
            echo "QEMU archive contains files outside its package directory" >&2
            exit 1
          fi
          test -f "$QEMU_PACKAGE_ROOT/manifest.json"
          grep -q "\"guest_arch\": \"$OHOS_QEMU_GUEST_ARCH\"" "$QEMU_PACKAGE_ROOT/manifest.json"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd "$QEMU_PACKAGE_ROOT" && sha256sum -c SHA256SUMS)
          else
            (cd "$QEMU_PACKAGE_ROOT" && LC_ALL=C LANG=C shasum -a 256 -c SHA256SUMS)
          fi
      - name: Install Rust target
        shell: bash
        run: |
          rustup target add "$OHOS_RUST_TARGET"
          if [[ "$OHOS_QEMU_RUST_ASAN" == 1 ]]; then
            rustup toolchain install nightly --profile minimal
            rustup target add --toolchain nightly "$OHOS_RUST_TARGET"
          fi
      - name: Check API 23, 24 and 26 compile profiles
        shell: bash
        run: |
          linker="$DEVECO_SDK_ROOT/native/llvm/bin/$OHOS_RUST_TARGET-clang"
          test -x "$linker"
          target_env="CARGO_TARGET_$(printf '%s' "$OHOS_RUST_TARGET" | tr '[:lower:]-' '[:upper:]_')_LINKER"
          for api in api23 api24 api26; do
            env "$target_env=$linker" cargo check -p ani \
              --target "$OHOS_RUST_TARGET" --no-default-features --features "$api"
          done
      - name: Launch the requested QEMU image
        shell: bash
        run: |
          test -f "$QEMU_PACKAGE_ROOT/manifest.json"
          grep -q "\"guest_arch\": \"$OHOS_QEMU_GUEST_ARCH\"" "$QEMU_PACKAGE_ROOT/manifest.json"
          port="${HDC_TARGET##*:}"
          case "$(uname)" in
            Darwin) launcher="$QEMU_PACKAGE_ROOT/launch/macos.command" ;;
            *) launcher="$QEMU_PACKAGE_ROOT/launch/linux.sh" ;;
          esac
          if [[ "$OHOS_QEMU_GUEST_ARCH" == x86_64 ]]; then
            qemu_accel=kvm
            wait_attempts=300
            wait_interval=2
          else
            qemu_accel=tcg
            wait_attempts=400
            wait_interval=3
          fi
          QEMU_DISPLAY=none QEMU_ACCEL="$qemu_accel" \
            QEMU_HDC_HOST_PORT="$port" "$launcher" \
            >"$RUNNER_TEMP/qemu-${OHOS_QEMU_GUEST_ARCH}.log" 2>&1 &
          echo "$!" >"$RUNNER_TEMP/qemu-${OHOS_QEMU_GUEST_ARCH}.pid"
          for attempt in $(seq 1 "$wait_attempts"); do
            if ! kill -0 "$(cat "$RUNNER_TEMP/qemu-${OHOS_QEMU_GUEST_ARCH}.pid")" 2>/dev/null; then
              echo "QEMU exited before HDC became ready" >&2
              cat "$RUNNER_TEMP/qemu-${OHOS_QEMU_GUEST_ARCH}.log" >&2
              exit 1
            fi
            "$DEVECO_SDK_ROOT/toolchains/hdc" tconn "$HDC_TARGET" >/dev/null 2>&1 || true
            if "$DEVECO_SDK_ROOT/toolchains/hdc" list targets |
              tr -d '\r' | grep -Fxq "$HDC_TARGET"; then
              exit 0
            fi
            sleep "$wait_interval"
          done
          cat "$RUNNER_TEMP/qemu-${OHOS_QEMU_GUEST_ARCH}.log" >&2
          exit 1
      - name: Verify the requested QEMU image is running
        shell: bash
        run: |
          test "$OHOS_QEMU_RELEASE_TAG" = v20260731
          test -f "$QEMU_PACKAGE_ROOT/manifest.json"
          grep -q "\"guest_arch\": \"$OHOS_QEMU_GUEST_ARCH\"" "$QEMU_PACKAGE_ROOT/manifest.json"
      - name: Verify connected OpenHarmony API level
        shell: bash
        run: |
          if command -v hdc >/dev/null 2>&1; then
            HDC_BIN="$(command -v hdc)"
          else
            HDC_BIN="$DEVECO_SDK_ROOT/toolchains/hdc"
          fi
          api_level="$("$HDC_BIN" -t "$HDC_TARGET" shell 'param get const.ohos.apiversion' | tr -d '\r[:space:]')"
          kernel="$("$HDC_BIN" -t "$HDC_TARGET" shell uname -r | tr -d '\r[:space:]')"
          version="$("$HDC_BIN" -t "$HDC_TARGET" shell 'param get const.product.software.version' | tr -d '\r')"
          echo "OpenHarmony: $version (API $api_level, kernel $kernel)"
          test "$api_level" -eq 26
          test "$kernel" = 6.6.101
      - name: Run cross-build, ABC compatibility and QEMU runtime suite
        run: scripts/run_arkvm_examples_ohos_qemu.sh
      - name: Build and verify HAP smoke artifact
        run: scripts/build_hap_smoke.sh "$OHOS_QEMU_GUEST_ARCH"
      - name: Execute ABC and ANI library extracted from HAP
        run: scripts/run_hap_abc_ohos_qemu.sh
      - name: Run bounded memory-growth stress suite
        run: scripts/check_qemu_memory.sh
      - name: Run real-guest performance ceiling
        env:
          OHOS_QEMU_PERF_DISABLE_JIT: 0
          OHOS_QEMU_SKIP_BUILD: 1
        run: scripts/check_qemu_performance.sh
      - name: Upload QEMU report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ohos-qemu-v20260731-api26-${{ matrix.guest_arch }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ani-rs-qemu-${{ github.run_id }}-${{ matrix.guest_arch }}/report.tsv
            ${{ runner.temp }}/ani-rs-qemu-${{ github.run_id }}-${{ matrix.guest_arch }}/memory.tsv
            ${{ runner.temp }}/ani-rs-qemu-${{ github.run_id }}-${{ matrix.guest_arch }}/performance.tsv
            ${{ runner.temp }}/ani-rs-qemu-${{ github.run_id }}-${{ matrix.guest_arch }}-hap-${{ matrix.guest_arch }}/report.tsv
            ${{ runner.temp }}/ani-rs-qemu-${{ github.run_id }}-${{ matrix.guest_arch }}-hap-${{ matrix.guest_arch }}/memory.tsv
            ${{ runner.temp }}/ani-rs-qemu-${{ github.run_id }}-${{ matrix.guest_arch }}-memory/report.tsv
            ${{ runner.temp }}/ani-rs-qemu-${{ github.run_id }}-${{ matrix.guest_arch }}-memory/memory.tsv
            ${{ runner.temp }}/ani-rs-qemu-${{ github.run_id }}-${{ matrix.guest_arch }}-performance/performance.tsv
            ${{ runner.temp }}/qemu-${{ matrix.guest_arch }}.log
          if-no-files-found: warn
      - name: Clean device test directory
        if: always()
        shell: bash
        run: |
          if command -v hdc >/dev/null 2>&1; then
            HDC_BIN="$(command -v hdc)"
          else
            HDC_BIN="$DEVECO_SDK_ROOT/toolchains/hdc"
          fi
          "$HDC_BIN" -t "$HDC_TARGET" shell "rm -rf '$OHOS_QEMU_REMOTE_ROOT'" || true
      - name: Stop matrix QEMU image
        if: always()
        shell: bash
        run: |
          pid_file="$RUNNER_TEMP/qemu-${OHOS_QEMU_GUEST_ARCH}.pid"
          if [[ -f "$pid_file" ]]; then
            pid="$(cat "$pid_file")"
            pkill -TERM -P "$pid" 2>/dev/null || true
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            pkill -KILL -P "$pid" 2>/dev/null || true
          fi
