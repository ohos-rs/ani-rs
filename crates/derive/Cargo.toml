[package]
name = "ani-derive"
version = "0.0.1-alpha.1"
edition = "2024"
description = "Procedural macros for ani-rs, providing napi-rs like ergonomics for ArkTS native development"
license = "Apache-2.0"
repository = "https://github.com/ohos-rs/ani-rs"
keywords = ["harmonyos", "arkts", "ani", "ffi", "macro"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full", "parsing", "extra-traits"] }
convert_case = "0.10"

[dev-dependencies]
trybuild = "1.0"
