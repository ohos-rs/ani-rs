[package]
name = "ani"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version.workspace = true
description = "ANI bindings for Rust - like napi-rs for ArkTS-Static"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ohos-rs/ani-rs"
keywords = ["ani", "arkts", "ohos", "harmonyos", "ffi"]
categories = ["api-bindings", "development-tools::ffi"]

[features]
default = ["api24"]
# Minimum-runtime contracts. `api26` is the release-validation profile and
# includes every ANI operation available in the pinned API 26 header.  The ANI
# ABI itself only added primitive boxing/unboxing after API 23, in API 24.
api23 = []
api24 = []
api26 = ["api24"]
# Enable anyhow error integration
error_anyhow = ["dep:anyhow"]
# Map serde values to native ArkTS Record/Array/boxed primitive object graphs.
serde-json = ["dep:serde", "dep:serde_json"]
# Executor-independent async runtime SPI. Applications can provide the entire
# runtime without linking Tokio.
async-runtime = []
# Ergonomic batteries-included alias. Tokio is only the default backend.
async = ["async-runtime", "tokio_rt"]
# Enable ani's built-in Tokio AsyncRuntime backend and Tokio helper APIs.
tokio_rt = ["async-runtime", "dep:tokio"]
# Tokio passthrough feature set aligned with napi-rs naming.
tokio_fs = ["tokio/fs"]
tokio_full = ["tokio/full"]
tokio_io_std = ["tokio/io-std"]
tokio_io_util = ["tokio/io-util"]
tokio_macros = ["tokio/macros"]
tokio_net = ["tokio/net"]
tokio_process = ["tokio/process"]
tokio_signal = ["tokio/signal"]
tokio_sync = ["tokio/sync"]
tokio_test_util = ["tokio/test-util"]
tokio_time = ["tokio/time"]

[dependencies]
ani-sys = { path = "../sys", version = "0.0.1-alpha.1" }
ctor = "0.6"

# Optional dependencies
anyhow = { version = "1", optional = true }
serde = { version = "1", optional = true }
serde_json = { version = "1", optional = true }
tokio = { version = "1", optional = true, default-features = false, features = ["rt", "rt-multi-thread", "sync"] }

[dev-dependencies]
loom = "0.7"
